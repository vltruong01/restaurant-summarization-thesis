schema_version: 1
stage: C2_budget_constrained_exploratory_pilot
algorithm_version: complete_review_search_v3
seed: 42
english_pool_directory: data/processed/yelp_2300_english_v1
c1_directory: outputs/stage_c/review_diagnostics_v1
original_pilot_directory: outputs/stage_c/review_selection_pilot_v1
output_directory: outputs/stage_c/review_selection_budget_pilot_v3
allowed_splits: [train, validation]
pilot:
  reuse_original_48_businesses: true
  additional_low_volume_top8_length_cases: 8
  low_volume_maximum_reviews: 100
  detail_examples: 10
selection:
  maximum_reviews: 30
  rating_population: all_C1_english_reviews_for_business
  quota_rule: hamilton_integer_remainders_ties_ascending_stars
  temporal_rule: one_random_review_per_rating_equal_frequency_rank_segment
  ordering: date_then_review_id
diagnostics:
  temporal_rank_bins: 5
  jsd_log_base: 2
  quality_thresholds: null
format:
  review_template: "[REV_{index}] stars={stars} date={date}\n{text}"
  separator: "\n\n"
  special_tokens: once_per_complete_review_block
budget:
  planned_total_source_target_approximate: 5000
  final_review_tokens: null
  exploratory_review_token_scenarios: [3500, 4000, 4500]
  scenario_status: explicitly_authorized_sensitivity_not_final_allocation
  removal_rating_weight: 0.5
  removal_temporal_weight: 0.5
  numerical_tie_tolerance: 1.0e-12
  minimum_selected_reviews: 1
search:
  rating_weight: 0.5
  temporal_weight: 0.5
  comparable_rating_jsd_tolerance: 0.001
  comparable_temporal_jsd_tolerance: 0.001
  tolerance_sensitivity: [0.0, 0.001, 0.005]
  local_iterations: 6
  local_starts: 3
  exact_proposals_per_ranking: 4
  shortest_available_per_star_time_cell: 2
  seeded_available_per_star_time_cell: 1
  seed_variants: [minimum_cost_singleton, rating_time_random, rating_time_low_cost, joint_distribution_low_cost]
  status: explicit_exploratory_search_settings_not_final_quality_thresholds
semantic:
  model_id: null
  model_revision: null
  status: not_computed_model_TBD
  selection_criterion: false
final_methodology_locked: false
final_selections_ready: false
