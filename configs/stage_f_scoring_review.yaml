schema_version: 1
status: proposed_not_approved_or_executed
output_directory: outputs/stage_f/scoring_definition_review_v1
immutable_generation_policy: configs/basic_caption_quality.yaml
model_candidates_for_user_review:
  CLIP:
    suggested_repository: openai/clip-vit-base-patch32
    approved: false
    pinned_revision: null
    score: cosine_of_L2_normalized_image_and_caption_features
    input_text: normalized_caption
    preprocessing: checkpoint_processor_with_EXIF_corrected_RGB
    no_softmax_across_caption_pool: true
    no_silent_caption_truncation: true
    overlength_policy: record_and_review_before_scoring
  semantic_embedding:
    suggested_repository: sentence-transformers/all-mpnet-base-v2
    approved: false
    pinned_revision: null
    input_text: normalized_caption
    similarity: cosine_of_L2_normalized_caption_embeddings
    uses: [redundancy, diversity, proposed_caption_domain_relevance]
  precision_and_versions:
    proposed_score_dtype: float32
    proposed_decision_score_round_decimals: 6
    packages_and_device_profile: null
business_relevance:
  user_scope_response: null
  suggested_scope: restaurant_bar_cafe_visual_domain_not_business_identity
  scorer_candidate: SBERT_caption_to_fixed_positive_negative_prototypes_margin
  formula: max_positive_cosine_minus_max_negative_cosine
  probability_claim: false
  positive_prototypes:
    - A caption describing prepared food, dishes, meals or desserts served at a dining venue.
    - A caption describing drinks, coffee or alcoholic beverages served at a dining venue.
    - A caption describing the interior, seating or dining area of a restaurant, cafe or bar.
    - A caption describing a menu, food advertisement or dining venue promotional material.
    - A caption describing a restaurant, cafe or bar exterior, entrance or venue signage.
    - A caption describing staff, service or patrons inside a dining venue or its seating area.
  negative_prototypes:
    - A caption describing an unrelated private bedroom or household bathroom.
    - A caption describing unrelated scenery, wildlife or a landscape without dining context.
    - A caption describing an unrelated personal portrait without dining venue context.
    - A caption describing software settings or an unrelated webpage screenshot.
    - A caption describing an unrelated product, gadget or appliance without dining context.
    - A caption describing a generic street or building without identifiable dining venue context.
  prototype_list_approved: false
  actual_business_identity_verification: not_supported_by_this_scorer
  review_text_used_to_score_relevance: false
quality_order_candidate:
  primary: highest_CLIP_consistency
  secondary: highest_relevance_margin
  final: ascending_photo_id
  extra_weighted_sum_or_lambda: false
redundancy_candidate:
  algorithm: quality_ranked_greedy_keep_if_cosine_to_each_kept_caption_below_threshold
  removed_caption_mapping: highest_similarity_kept_representative_then_photo_id
  threshold: null
  no_transitive_connected_component_deletion_by_default: true
diversity_candidate:
  algorithm: deterministic_farthest_first
  first: highest_quality_order_candidate
  next: maximize_minimum_cosine_distance_to_selected
  distance: one_minus_cosine
  ties: [higher_CLIP, higher_relevance_margin, ascending_photo_id]
  nested_prefix_for_all_K: true
  lambda: not_used
coverage_definition_decision:
  same_groups_as_single_representative_redundancy: degenerates_to_min_K_G_over_G
  option_A: disclose_count_based_nonredundant_group_coverage
  option_B: separately_calibrated_coarser_frozen_reference_groups
  selected_option: null
  coarser_group_algorithm_threshold_if_B: null
internal_validation_roles_proposal:
  calibration_businesses: 40
  K_study_businesses: 160
  seed: 42
  business_level_no_overlap: true
  photo_count_bands: ['5-7', '8-9', '10-19', '20+']
  calibration_per_band: 10
  metadata_label_representation_check_before_labels: true
  exact_image_overlap_audit_between_roles_required: true
  actual_role_manifest: null
calibration_proposal:
  human_checks_only_calibration_businesses: true
  image_caption_consistency_labels: [consistent, inconsistent, uncertain]
  domain_relevance_labels: [relevant, irrelevant, uncertain]
  pair_redundancy_labels: [same_information, complementary_information, uncertain]
  coarser_group_labels_if_option_B: [same_broad_visual_topic, different_topic, uncertain]
  candidate_threshold_grids: null
  label_sample_sizes_and_score_strata: null
  threshold_selection_metric_and_ties: null
  labels_are_actual_human_not_assistant_auto_labels: true
  final_30_business_human_evaluation_is_separate: true
K_study:
  candidates: [3, 5, 8, 10]
  primary: smallest_feasible_K_at_95_percent_best_macro_K_study_coverage
  relative_fraction: 0.95
  thresholds_frozen_before_any_K_metrics: true
  both_caption_conditions_same_K_and_caption_budget: true
  final_K: null
approved_models_scorers_thresholds_roles_K: false
full_validation_caption_generation_started: false
train_or_test_new_caption_generation_started: false
