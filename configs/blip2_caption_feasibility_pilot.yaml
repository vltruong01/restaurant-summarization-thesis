schema_version: 1
stage: E0_managed_caption_feasibility
algorithm_version: blip2_raw_caption_pilot_v1
seed: 42
output_directory: outputs/stage_e/blip2_caption_feasibility_pilot_v1
isolated_environment: .venv-caption-pilot
model_cache: assets/model_cache
model_id: Salesforce/blip2-opt-2.7b-coco
requested_revision: main
resolve_and_persist_commit_before_generation: true
device:
  require_cuda: true
  mode: auto_GPU_CPU_offload
  weight_dtype: float16
  quantization: none
  gpu_safety_reserve_GiB: 1.25
  cpu_safety_reserve_GiB: 3.0
  minimum_available_RAM_GiB: 8.0
  minimum_free_disk_GiB: 40.0
  production_precision: null
  preferred_existing_CUDA_runtime: torch2.1.0_cu118_torchvision0.16.0_read_only
pilot:
  allowed_splits: [train, validation]
  review_volume_bands: ['10-30', '31-100', '101-300', '301+']
  businesses_per_split_per_band: 1
  images_per_business: 3
  selection: seeded_hash_order_original_readable_IDs_without_deduplication
  final_maximum_k: null
generation:
  batch_size: 1
  num_beams: 3
  do_sample: false
  max_new_tokens: 64
  initial_prompt: null
  retry_once_if_surface_failure: true
  retry_prompt: 'Describe this image in one complete sentence:'
surface_diagnostics:
  minimum_words: 5
  terminal_punctuation: ['.', '!', '?']
  exact_generic_phrases: ['a plate of food', 'a plate of food on a table', 'a picture of food', 'an image of food', 'a restaurant', 'a table with food']
  grammar_check: manual_review_pending
  production_generic_policy: null
source_diagnostics:
  accepted_review_budget: 4000
  metadata_profile: name_categories_location
  entire_caption_allowance_exploratory: 750
  total_source_ceiling_exploratory: 5000
  caption_template: '[IMG_CAP_{index}] {text}'
  final_allocation: null
execution:
  enabled_by_notebook: true
  auto_create_isolated_environment: true
  allow_package_installation_on_user_run: true
  allow_model_download_on_user_run: true
  execution_origin: agent_or_user_recorded_per_run
final_caption_sets: false
final_manifest: false
teacher_or_LED_training: false
