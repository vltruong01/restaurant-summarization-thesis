<!doctype html><html lang="vi"><meta charset="utf-8"><title>Stage F — Human calibration</title>
<style>body{font:16px system-ui;margin:24px auto;max-width:1200px;background:#f5f7fa;color:#182335}h1{font-size:25px}.bar,.box{padding:16px;background:white;border-radius:10px;margin:12px 0}.photos{display:flex;gap:20px}.photo{flex:1;min-width:0}.photo img{width:100%;height:350px;object-fit:contain;background:#eef1f4}select,button,input,textarea{font:inherit;padding:9px;margin:5px}button{cursor:pointer}label{display:block}pre{white-space:pre-wrap;font:14px system-ui}.muted{color:#596579}textarea{width:95%}.warning{background:#fff0c2;padding:10px}</style>
<h1>Stage F — Nhãn human để calibration thresholds</h1><div class="bar"><strong>Đây là calibration, riêng với human evaluation 30 businesses cuối thesis.</strong><p>Không dùng scores của model để đoán nhãn. “Uncertain” hợp lệ. Các thay đổi lưu trong browser; hãy xuất JSON để lưu bền vững. File local không gửi nhãn ra mạng.</p><div id="status"></div><label>Người gán nhãn <input id="annotator" placeholder="Tên hoặc mã người gán nhãn"></label><button id="export">Xuất annotations JSON</button></div>
<div class="bar"><button id="previous">← Trước</button><button id="next">Tiếp →</button><button id="pending">Case chưa xong</button><span id="position"></span><select id="mode"><option value="all">Tất cả</option><option value="image_caption">Ảnh–caption</option><option value="caption_pair">Cặp captions</option></select></div><div class="box" id="case"></div>
<script>
const DATA=__ANNOTATION_DATA__;
const KEY='stageF_human_'+DATA.dataset_sha256;
let state={},index=0;try{state=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
state.labels=state.labels||{};
const choices={consistency:['consistent','inconsistent','uncertain'],relevance:['relevant','irrelevant','uncertain'],redundancy:['same_information','complementary_information','uncertain'],broad_topic:['same_broad_visual_topic','different_topic','uncertain'],image_duplicate:['same_visual_content','distinct_content','uncertain']};
const names={consistency:'Caption mô tả đúng ảnh, không có chi tiết sai đáng kể?',relevance:'Caption có ngữ cảnh nhà hàng/quán ăn/bar/cafe?',redundancy:'Hai caption lặp lại cùng thông tin hay bổ sung thông tin?',broad_topic:'Cùng chủ đề thị giác rộng hơn? Ví dụ hai món ăn khác nhau có thể bổ sung thông tin nhưng cùng chủ đề.',image_duplicate:'Hai ảnh là cùng nội dung thị giác/biến thể gần trùng hay hai nội dung khác nhau?'};
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){document.getElementById('status').textContent='Browser không autosave được; hãy xuất JSON thường xuyên.';}}
function cases(){let mode=document.getElementById('mode').value;return DATA.cases.filter(c=>mode==='all'||c.kind===mode);}
function done(c){let row=state.labels[c.case_id]||{};return Object.keys(c.labels).every(k=>choices[k].includes(row[k]));}
function render(){let list=cases();index=Math.max(0,Math.min(index,list.length-1));let c=list[index],box=document.getElementById('case');box.replaceChildren();document.getElementById('position').textContent=`${index+1}/${list.length}`;document.getElementById('status').textContent=`Đã hoàn tất ${DATA.cases.filter(done).length}/${DATA.cases.length} cases.`;
if(DATA.dataset_kind!=='official_calibration'){let w=document.createElement('p');w.className='warning';w.textContent='PREVIEW giao diện — nhãn trong bản này không dùng để chọn thresholds.';box.append(w);}
if(!c){box.textContent='Chưa có cases.';return;}
let h=document.createElement('h2');h.textContent=c.name+' — '+c.case_id;box.append(h);let photos=document.createElement('div');photos.className='photos';box.append(photos);
c.photo_ids.forEach((id,i)=>{let part=document.createElement('div');part.className='photo';let img=document.createElement('img');img.src=DATA.images?.[id]||c.image_paths[i];img.alt=id;part.append(img);let raw=document.createElement('pre');raw.textContent='Raw: '+c.raw_captions[i]+'\nNormalized: '+c.normalized_captions[i];part.append(raw);photos.append(part);});
if(c.kind==='caption_pair'){let hint=document.createElement('p');hint.className='muted';hint.textContent='Redundancy và broad topic xét thông tin có trong caption, không thêm chi tiết chỉ nhìn thấy ở ảnh. Hai món có chi tiết khác nhau có thể bổ sung thông tin nhưng cùng một nhóm chủ đề. Cùng thông tin không thể là khác chủ đề.';box.append(hint);}
let row=state.labels[c.case_id]=state.labels[c.case_id]||{};Object.keys(c.labels).forEach(k=>{let label=document.createElement('label');label.textContent=names[k];let sel=document.createElement('select');let empty=document.createElement('option');empty.value='';empty.textContent='Chọn nhãn';sel.append(empty);choices[k].forEach(value=>{let o=document.createElement('option');o.value=value;o.textContent=value;sel.append(o);});sel.value=row[k]||'';sel.onchange=()=>{row[k]=sel.value;persist();document.getElementById('status').textContent=`Đã hoàn tất ${DATA.cases.filter(done).length}/${DATA.cases.length} cases.`;};label.append(sel);box.append(label);});let notes=document.createElement('textarea');notes.placeholder='Ghi chú / lý do uncertain';notes.value=row.notes||'';notes.oninput=()=>{row.notes=notes.value;persist();};box.append(notes);}
document.getElementById('annotator').value=state.annotator||'';document.getElementById('annotator').oninput=e=>{state.annotator=e.target.value;persist();};
document.getElementById('previous').onclick=()=>{index--;render();};document.getElementById('next').onclick=()=>{index++;render();};document.getElementById('mode').onchange=()=>{index=0;render();};document.getElementById('pending').onclick=()=>{let list=cases(),n=list.findIndex((c,i)=>i>index&&!done(c));index=n>=0?n:Math.max(0,list.findIndex(c=>!done(c)));render();};
document.getElementById('export').onclick=()=>{if(!state.annotator?.trim()){alert('Nhập tên/mã người gán nhãn trước khi xuất.');return;}let data={schema_version:1,dataset_sha256:DATA.dataset_sha256,dataset_kind:DATA.dataset_kind,annotator:state.annotator,human_confirmed:true,exported_at:new Date().toISOString(),cases:DATA.cases.map(c=>({case_id:c.case_id,labels:Object.fromEntries(Object.keys(c.labels).map(k=>[k,state.labels[c.case_id]?.[k]||''])),notes:state.labels[c.case_id]?.notes||''}))};let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));let link=document.createElement('a');link.href=url;link.download='stage_f_human_annotations.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
